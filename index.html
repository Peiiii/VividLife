
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VividLife | 悦活身心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* More vivid, "living" colors */
            --sage-green: #4A614D; /* Deepened for clarity */
            --sage-vivid: #6B8E23;
            --clay: #506D84;
            --sand: #FEFDFB; /* Cleaner white-sand */
            --earth: #1A1616; /* Darker for high contrast */
            --amber-glow: #F59E0B;
        }
        body {
            font-family: 'Inter', "Microsoft YaHei", sans-serif;
            background-color: var(--sand);
            color: var(--earth);
            -webkit-font-smoothing: antialiased;
        }
        .serif {
            font-family: 'Noto Serif SC', serif;
        }
        
        /* Glassmorphism for a "clear" look */
        .glass-clear {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Improved Markdown Clarity */
        .markdown-content {
            line-height: 1.85;
            font-size: 1.125rem;
            color: #2D3748;
        }
        .markdown-content h1, .markdown-content h2 {
            font-family: 'Noto Serif SC', serif;
            color: var(--sage-green);
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
        }
        .markdown-content strong {
            color: var(--earth);
            font-weight: 700;
        }
        .markdown-content blockquote {
            border-left: 4px solid var(--sage-green);
            padding: 1.5rem 2rem;
            background: #F8F9F3;
            border-radius: 0 1rem 1rem 0;
            font-style: italic;
            color: var(--clay);
            margin: 2.5rem 0;
        }
        
        .btn-vivid {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-vivid:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
    </style>
<script type="importmap">
{

    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "marked": "https://esm.sh/marked@^15.0.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
