
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VividLife | 悦活身心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage-green: #5F7161;
            --sage-light: #859669;
            --clay: #6D8299;
            --sand: #FDFBF7;
            --earth: #3E3232;
        }
        body {
            font-family: 'Inter', "Microsoft YaHei", sans-serif;
            background-color: var(--sand);
            color: var(--earth);
        }
        .serif {
            font-family: 'Noto Serif SC', serif;
        }
        /* 自定义滚动条 - 极简 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        
        /* Markdown 样式重塑 - 更像高端杂志 */
        .markdown-content {
            line-height: 1.8;
            font-size: 1.1rem;
        }
        .markdown-content h1, .markdown-content h2 {
            font-family: 'Noto Serif SC', serif;
            color: var(--sage-green);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
        }
        .markdown-content p { margin-bottom: 1.5rem; }
        .markdown-content blockquote {
            border-left: 3px solid var(--sage-green);
            padding-left: 1.5rem;
            font-style: italic;
            color: var(--clay);
            margin: 2rem 0;
        }
        .markdown-content img {
            border-radius: 1rem;
            margin: 2rem 0;
        }
        /* 按钮动效 */
        .btn-organic {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-organic:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(95, 113, 97, 0.3);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "marked": "https://esm.sh/marked@^15.0.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
